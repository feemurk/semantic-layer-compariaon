# Metric view slc.semantic.wwi_orders. Generated by build_metric_views.py from its view definitions and
# 01-spec/glossary.yaml; edit the builder, not this file. YAML specification 1.1.
version: 1.1
comment: WideWorldImporters orders at order line grain (W-S2, B-W5), dated by order date.
source: slc.wwi.fact_order
joins:
- name: ord_cal
  source: slc.wwi.dim_date
  'on': source.order_date = ord_cal.date_key
  rely:
    at_most_one_match: true
- name: cust
  source: slc.wwi.dim_customer
  'on': source.customer_key = cust.customer_key
  rely:
    at_most_one_match: true
- name: geo
  source: slc.wwi.dim_city
  'on': source.city_key = geo.city_key
  rely:
    at_most_one_match: true
- name: item
  source: slc.wwi.dim_stock_item
  'on': source.stock_item_key = item.stock_item_key
  rely:
    at_most_one_match: true
  joins:
  - name: item_current
    source: slc.wwi.dim_stock_item
    'on': item.wwi_stock_item_id = item_current.wwi_stock_item_id AND item_current.is_current
    rely:
      at_most_one_match: true
- name: rep
  source: slc.wwi.dim_employee
  'on': source.salesperson_key = rep.employee_key
  rely:
    at_most_one_match: true
- name: picker_emp
  source: slc.wwi.dim_employee
  'on': source.picker_key = picker_emp.employee_key
  rely:
    at_most_one_match: true
fields:
- name: order_date
  expr: source.order_date
  comment: Shared calendar with a fiscal year starting 1 November, labeled by the year in which it ends.
  display_name: Order Date
- name: calendar_year
  expr: ord_cal.calendar_year
  display_name: Calendar Year
- name: calendar_quarter
  expr: ord_cal.calendar_quarter
  display_name: Calendar Quarter
- name: calendar_month
  expr: ord_cal.calendar_month
  display_name: Calendar Month
- name: month_name
  expr: ord_cal.month_name
  display_name: Month Name
- name: month_start_date
  expr: ord_cal.month_start_date
  display_name: Month Start Date
- name: fiscal_year
  expr: ord_cal.fiscal_year
  comment: Fiscal year starting 1 November, labeled by the year in which it ends.
  display_name: Fiscal Year
- name: fiscal_quarter
  expr: ord_cal.fiscal_quarter
  display_name: Fiscal Quarter
- name: fiscal_month
  expr: ord_cal.fiscal_month
  comment: Fiscal month, November = 1.
  display_name: Fiscal Month
- name: day_of_week
  expr: ord_cal.day_of_week
  comment: ISO day of week, Monday = 1.
  display_name: Day Of Week
- name: customer
  expr: cust.customer
  comment: Customer as recorded at the time of sale.
  display_name: Customer
  synonyms:
  - client
  - account
  - store
  - buyer
- name: customer_category
  expr: cust.category
  display_name: Customer Category
- name: buying_group
  expr: cust.buying_group
  display_name: Buying Group
- name: city
  expr: geo.city
  comment: Delivery city as recorded at the time of sale; Sales Territory is an alternate hierarchy over State Province.
  display_name: City
  synonyms:
  - location
  - territory
  - state
- name: state_province
  expr: geo.state_province
  display_name: State Province
- name: country
  expr: geo.country
  display_name: Country
- name: continent
  expr: geo.continent
  display_name: Continent
- name: sales_territory
  expr: geo.sales_territory
  comment: Sales territory of the delivery city at the time of sale.
  display_name: Sales Territory
- name: region
  expr: geo.region
  display_name: Region
- name: subregion
  expr: geo.subregion
  display_name: Subregion
- name: stock_item
  expr: item.stock_item
  comment: Product as recorded at the time of sale (SCD Type 2); current attributes via the durable item id.
  display_name: Stock Item
  synonyms:
  - product
  - item
  - SKU
  - article
- name: wwi_stock_item_id
  expr: item.wwi_stock_item_id
  comment: Durable stock item id (stable across SCD Type 2 versions).
  display_name: WWI Stock Item ID
- name: brand
  expr: item.brand
  display_name: Brand
- name: color
  expr: item.color
  comment: Color as recorded at the time of the fact (as-was).
  display_name: Color
- name: size
  expr: item.size
  display_name: Size
- name: selling_package
  expr: item.selling_package
  display_name: Selling Package
- name: is_chiller_stock
  expr: item.is_chiller_stock
  display_name: Is Chiller Stock
- name: current_color
  expr: item.item_current.color
  comment: Color of the current version of the stock item (as-is).
  display_name: Current Color
- name: salesperson
  expr: rep.employee
  comment: Employee credited with the sale or order (role of the Employee dimension).
  display_name: Salesperson
  synonyms:
  - sales rep
  - seller
  - account manager
  - rep
- name: picker
  expr: picker_emp.employee
  comment: Employee who picked the order (role of the Employee dimension); applies to orders only.
  display_name: Picker
  synonyms:
  - warehouse picker
  - picked by
  - fulfiller
measures:
- name: ordered_quantity
  expr: SUM(quantity)
  comment: Sum of ordered quantity (fact_order.quantity), dated by order date.
  display_name: Ordered Quantity
  format:
    type: number
    decimal_places:
      type: exact
      places: 0
  synonyms:
  - units ordered
  - order quantity
  - quantity ordered
  - demand
- name: backordered_order_lines
  expr: NULLIF(COUNT(wwi_backorder_id), 0)
  comment: Count of order lines with a backorder (fact_order.wwi_backorder_id is not null); blank when no line qualifies.
  display_name: Backordered Order Lines
  format:
    type: number
    decimal_places:
      type: exact
      places: 0
  synonyms:
  - backorders
  - backordered lines
  - lines on backorder
