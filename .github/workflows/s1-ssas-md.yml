# SPEC E5 for S1: lint -> deploy to test -> process -> MDX reconciliation subset -> promote, on every push.
# Lint runs on a GitHub-hosted Linux runner. Deployment runs on a self-hosted Windows runner (label slc-ssas) that
# has PowerShell 7, the SqlServer module and Python 3, and network access to the SSAS 2025 and SQL Server 2025 hosts.
# GitHub environments `test` and `prod` hold variables SSAS_SERVER, SQL_SERVER, DATABRICKS_HOST, DATABRICKS_HTTP_PATH
# and secrets DATABRICKS_TOKEN, ADAPTER_MASTER_KEY_PASSWORD.
name: s1-ssas-md

on:
  push:
    paths:
      - 02-implementations/ssas-md/**
      - 01-spec/oracle/expected/**
      - 01-spec/glossary.yaml
      - scripts/test_ssas_md.py
      - .github/workflows/s1-ssas-md.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1-ssas-md-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r scripts/requirements-test.txt
      - run: python 02-implementations/ssas-md/build_model.py --check
      - run: python 02-implementations/ssas-md/build_reconciliation_queries.py --check
      - run: python 02-implementations/ssas-md/lint_mdx.py
      - run: python scripts/test_ssas_md.py

  test:
    needs: lint
    runs-on: [self-hosted, windows, slc-ssas]
    environment: test
    defaults:
      run:
        shell: pwsh
        working-directory: 02-implementations/ssas-md
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      ADAPTER_MASTER_KEY_PASSWORD: ${{ secrets.ADAPTER_MASTER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.ps1 -SsasServer '${{ vars.SSAS_SERVER }}' -SqlServer '${{ vars.SQL_SERVER }}'
      - run: ./scripts/reconcile.ps1 -SsasServer '${{ vars.SSAS_SERVER }}' -Select 'Q-*-P' -FailOnMismatch

  promote:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, slc-ssas]
    environment: prod
    defaults:
      run:
        shell: pwsh
        working-directory: 02-implementations/ssas-md
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      ADAPTER_MASTER_KEY_PASSWORD: ${{ secrets.ADAPTER_MASTER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.ps1 -SsasServer '${{ vars.SSAS_SERVER }}' -SqlServer '${{ vars.SQL_SERVER }}'
      - run: ./scripts/reconcile.ps1 -SsasServer '${{ vars.SSAS_SERVER }}' -Select 'Q-*-P' -FailOnMismatch
