  - stack: S3
    dimension: E5
    rating: Meets
    evidence: Design inference
    confidence: Low
    pending: [V-52]
    rationale: >-
      A push runs lint, publish of the live and extract data sources through the REST API, the P-question gate, and
      promotion. Environment values are injected at publish time and nothing environment-specific is committed.
    citations: [V-52, 02-implementations/bi-layer/TABLEAU_GUIDE.md, .github/workflows/s3-tableau.yml]
    confirm: A calculation change flows to prod unattended and the gate passes.

  - stack: S4
    dimension: E5
    rating: Meets
    evidence: Design inference
    confidence: Low
    rationale: >-
      A push runs lint and tests, then bundle deploy, the deploy job and the P-question gate in test, then promotion,
      authenticated by workload identity federation with no stored token (V-33). The bundle syncs the oracle answers
      from the same commit (V-32). The jobs have not run on a workspace.
    citations: [V-32, V-33, 02-implementations/databricks-metric-views/METRIC_VIEWS_GUIDE.md, .github/workflows/s4-metric-views.yml]
    confirm: A YAML change flows to prod unattended; the gate fails when a planted wrong measure is pushed.

  # ------------------------------------------------------------------ E6 Partition and refresh automation
  - stack: S1
    dimension: E6
    rating: Meets
    evidence: Design inference
    confidence: Low
    pending: [V-40]
    rationale: >-
      The rollover script reads the current partitions and runs one transactional batch: create and process the closed
      month, re-slice the hot partition, retire months beyond 24, then clear the cache. Plans for two consecutive months
      are tested locally, and partition coverage of every trip is checked on the fixtures. Enterprise edition is required
      for more than three partitions (V-35).
    citations: [V-35, 02-implementations/ssas-md/jobs/partition_rollover.py, scripts/test_ssas_md.py]
    confirm: Two consecutive simulated rollovers on the server with E1 still passing.

  - stack: S2
    dimension: E6
    rating: Meets
    evidence: Documented
    confidence: Medium
    rationale: >-
      The hybrid refresh policy keeps 24 monthly partitions, refreshes the last 3 days incrementally and adds the
      real-time partition. The service creates, merges and retires partitions on each applyRefreshPolicy refresh (V-13).
    citations: [V-13, 02-implementations/powerbi-tabular/POWERBI_TABULAR_GUIDE.md]
    confirm: Two consecutive simulated month closes leave exactly 24 monthly partitions with E1 still passing.

  - stack: S3
    dimension: E6
    rating: Meets
    evidence: Design inference
    confidence: Low
    pending: [V-52]
    rationale: >-
      The NYC extract refreshes incrementally on the pickup timestamp. A monthly full refresh with a rolling 24-month
      relative-date extract filter retires the month that left the window. The live variant has no partitions to manage.
    citations: [V-50, V-52, 02-implementations/bi-layer/jobs/refresh.py]
    confirm: Two simulated rollovers leave exactly 24 months in the extract with E1 still passing.

  - stack: S4
    dimension: E6
    rating: Meets
    evidence: Design inference
    confidence: Low
    rationale: >-
      The semantic layer holds no partitions: the views read clustered Delta live, and retention beyond 24 months is a
      platform delete. Materializations refresh on their schedule, incrementally where possible (V-29). Nothing in S4
      needs a rollover step.
    citations: [V-29, 02-implementations/databricks-metric-views/METRIC_VIEWS_GUIDE.md]
    confirm: After two simulated rollovers on the platform, E1 passes in both profiles with no S4 change.

  # ------------------------------------------------------------------ E7 AI agent accessibility
  - stack: S1
    dimension: E7
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-04]
    expected_range: >-
      Common-harness lane only, over XMLA/MDX. Accuracy depends on the agent writing MDX against a cube whose metadata
      comes from the same glossary as every other stack.
    rationale: >-
      There is no native assistant (B-04), so the agent harness is the only lane. Its MCP server exists only as
      specification (SPEC § 11), so no accuracy can be projected beyond parity of metadata.
    citations: [B-04, 02-implementations/ssas-md/SSAS_MD_GUIDE.md]
    confirm: Harness-lane accuracy, pass@3 and 3-of-3 consistency on the 70 questions.

  - stack: S2
    dimension: E7
    rating: Not assessable
    evidence: Design inference
    confidence: Low
    pending: [V-45]
    expected_range: >-
      Copilot lane over a model with AI instructions, verified answers and synonyms, plus the harness lane over XMLA/DAX.
      Calendar-anchored measures avoid the B-07 errors an agent would inherit in S4.
    rationale: >-
      Agent accuracy is a measurement. The linguistic schema format for synonyms is undocumented (V-45), and verified
      answers need manual setup (B-12).
    citations: [V-13, V-45, 02-implementations/powerbi-tabular/POWERBI_TABULAR_GUIDE.md]
    confirm: Copilot and harness accuracy, pass@3 and consistency on the 70 questions.

  - stack: S3
    dimension: E7
    rating: Meets with workaround
    evidence: Documented
    confidence: Medium
    boundaries: [B-18]
    expected_range: >-
      Tableau Agent lane plus the harness lane over the query service. Synonyms are appended to descriptions, and 5 of 69
      visible fields carry synonyms beyond the 150 indexed characters.
    rationale: >-
      Tableau Agent indexes captions and the first 150 characters of descriptions only (V-14), and there is no synonym
      property (B-18). Multi-call question plans (B-16) are hard for an agent to discover unaided.
    citations: [V-14, B-16, B-18, 02-implementations/bi-layer/TABLEAU_GUIDE.md]
    confirm: Agent and harness accuracy on the 70 questions, split by whether the needed synonym is inside the indexed prefix.

  - stack: S4
    dimension: E7
    rating: Partial
    evidence: Documented
    confidence: Low
    boundaries: [B-07, B-08]
    pending: [V-31]
    subset: >-
      Genie and the harness read rich metadata (comment, display_name, synonyms, format) on every member. No lane can
      answer exactly the questions B-07 and B-08 affect, and a date filter pushed into a window-measure query truncates
      the window (V-31).
    expected_range: >-
      Strong metadata coverage. The accuracy ceiling is set by Q-N-S2-D4, by sparse-member period-to-date questions, and
      by how often agents place date filters inside window queries.
    rationale: >-
      Agent metadata is first-class in YAML 1.1 (V-01, V-08), but semantic gaps in the layer pass straight through to
      every agent.
    citations: [V-01, V-08, V-31, B-07, B-08, 02-implementations/databricks-metric-views/METRIC_VIEWS_GUIDE.md]
    confirm: Genie and harness accuracy, with the share of window questions where the agent filtered inside the window.

  # ------------------------------------------------------------------ E8 Governance parity
  - stack: S1
    dimension: E8
    rating: Meets
    evidence: Design inference
    confidence: Low
    pending: [V-38]
    rationale: >-
      Roles restrict City to the Southeast territory with visual totals, and grant an empty allowed set on inventory.
      Restricted expected answers now exist for every P and D1 question. If an empty allowed set raises an error instead
      of returning NULL (V-38), the cell-security fallback returns #N/A and differs from the oracle.
    citations: [V-38, 02-implementations/ssas-md/SSAS_MD_GUIDE.md, 01-spec/oracle/expected/restricted]
    confirm: The 24 restricted questions reconcile per role in the harness and through Excel.

  - stack: S2
    dimension: E8
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-13]
    rationale: >-
      Model RLS roles implement both SPEC § 10 rules, and the dropoff role stays unrestricted. Role reconciliation in CI
      uses XMLA with an effective identity, because service principals cannot be role members and executeQueries refuses
      them on RLS models (B-13).
    citations: [V-41, V-42, B-13, 02-implementations/powerbi-tabular/POWERBI_TABULAR_GUIDE.md, 01-spec/oracle/expected/restricted]
    confirm: The 24 restricted questions reconcile per role in each variant, through reports and Copilot.

  - stack: S3
    dimension: E8
    rating: Meets
    evidence: Design inference
    confidence: Low
    pending: [V-53]
    rationale: >-
      Data source filters with ISMEMBEROF are evaluated for the querying identity. The territory filter is pervasive
      because it references City, so it also narrows the City member list. The stock filter denies inventory, and the
      NYC filter is scoped to Trips so dropoff zones stay browsable.
    citations: [V-49, V-53, 02-implementations/bi-layer/TABLEAU_GUIDE.md, 01-spec/oracle/expected/restricted]
    confirm: The 24 restricted questions reconcile per role through the query service and Tableau Agent.

  - stack: S4
    dimension: E8
    rating: Meets with workaround
