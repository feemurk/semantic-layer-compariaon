verdicts:
  - claim: MC-01
    verdict: Refuted with cost
    evidence: Design inference
    confidence: Low
    cells: [S1/E4, S2/E4]
    rationale: >-
      The cube serves the current month from a ROLAP hot partition, so new rows are visible without processing. Over
      Databricks this costs a SQL Server adapter (B-09) and an explicit cache clear (B-10). The Tabular engine's hybrid
      partition needs no workaround.
    confirm: S1 sentinel-trip p95 within 15 minutes with the cache-clear cadence recorded.

  - claim: MC-02
    verdict: Refuted
    evidence: Design inference
    confidence: Low
    cells: [S1/E5, S2/E5]
    rationale: >-
      The cube is generated from Python into ASSL, deployed and processed over XMLA, and gated on oracle reconciliation
      by a GitHub workflow, with no manual step. The Power BI gaps are vendor features (verified answers), not the legacy
      engine.
    confirm: An unattended S1 deploy-process-reconcile-promote run from a Git push.

  - claim: MC-03
    verdict: Inconclusive
    evidence: Design inference
    confidence: Low
    cells: [S1/E3, S1/E6]
    rationale: >-
      The design (about 80M trips in 24 monthly MOLAP partitions, per-month distinct-count groups, automated rollover)
      gives no reason to expect failure. Scale is a measurement, and nothing has been measured.
    confirm: S1 E3 percentiles at concurrency 10 and two clean rollovers on the full data.

  - claim: MC-04
    verdict: Refuted with cost
    evidence: Design inference
    confidence: Low
    cells: [S1/E1, S2/E1, S3/E1, S4/E1]
    rationale: >-
      The SQL-native layer handles semi-additive and period-to-date logic with window measures, without a proprietary
      engine. But it anchors on data, not the calendar (B-07), and cannot list members without facts (B-08). Matching
      the SPEC needs a calendar × member dense source at a cost of days × members rows per dimension. The proprietary
      engines (MDX, DAX) meet the definition directly.
    confirm: S4 window-metric reconciliation confirming B-07, set against S1 and S2 matching the same cells.

  - claim: MC-05
    verdict: Inconclusive
    evidence: Design inference
    confidence: Low
    cells: [S1/E7, S2/E7, S3/E7, S4/E7]
    rationale: >-
      Agent accuracy is unmeasured. Structurally, the SQL-native layer's semantic gaps (B-07, B-08) pass straight into
      agent answers. The legacy cube is reachable only through the common harness (B-04), not denied to agents.
    confirm: Per-lane accuracy, pass@3 and consistency for all four stacks on the 70 questions.

  - claim: MC-06
    verdict: Refuted
    evidence: Design inference
    confidence: Low
    cells: [S1/E2, S2/E2, S4/E2]
    rationale: >-
