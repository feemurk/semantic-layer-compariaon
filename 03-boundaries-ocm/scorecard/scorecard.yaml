# Projected evaluation scorecard (SPEC § 8.2). Every cell is a projection, not a measurement.
# Source of PROJECTED_SCORECARD.md (build_scorecard.py); validated by scripts/test_scorecard.py.
# Fields per cell:
#   stack, dimension          S1-S4 x E1-E9
#   rating                    Meets | Meets with workaround | Partial | Does not meet | Not assessable
#   evidence                  weakest level the rating depends on: Locally verified | Documented | Design inference | Unknown
#   confidence                High | Medium | Low (capped by the evidence level and by any Pending item)
#   boundaries                B- entries the rating rests on (required for Meets with workaround)
#   pending                   Pending § 14 entries the rating depends on (forces Low)
#   subset                    what holds and what fails (required for Partial)
#   expected_range            E3, E4, E7 only: the expected measurement and its basis
#   rationale, citations      the argument and its sources (V-/B- entries, repository paths)
#   confirm                   the observation in a measured run that confirms or overturns the cell
as_of: 2026-11-21
spec_version: 1.5

findings:
  - text: >-
      Modern engineering practice is not where the legacy stacks fall short. The cube is projected to meet CI/CD,
      partition rollover and near-real-time freshness, at the cost of a SQL Server adapter and a cache-clear cadence.
      The Tabular model meets rollover, and meets CI/CD except for manual Copilot setup.
    cells: [S1/E4, S1/E5, S1/E6, S2/E5, S2/E6]
  - text: >-
      Calendar time intelligence favors the proprietary engines. MDX and DAX anchor on the calendar, and Tableau does so
      with a parameter. The SQL-native metric views anchor on the last date with data and cannot list members without
      facts, the only projected E1 shortfall.
    cells: [S1/E1, S2/E1, S3/E1, S4/E1]
  - text: >-
      Governance and speed trade off in the lakehouse layer. Unity Catalog enforces the security rules once for every
      consumer, but a governed metric view cannot be materialized, so the fast path and the secure path are separate
      deployments.
    cells: [S4/E3, S4/E8]
  - text: >-
      Semantic-layer-as-code is universal. All four stacks are generated or linted from Git and validated by committed
      suites; YAML has no monopoly.
    cells: [S1/E5, S2/E5, S3/E5, S4/E5]
  - text: >-
      Most of the scorecard is low-confidence by construction. 26 of the 36 cells rest on design inference or on an
      unverified vendor behavior, and performance, freshness latency and agent accuracy stay open for every stack until
      a measured run.
    cells: [S1/E3, S2/E3, S3/E3, S4/E3, S2/E4, S2/E7, S4/E7]

cells:
  # ------------------------------------------------------------------ E1 Metric correctness
  - stack: S1
    dimension: E1
    rating: Meets
    evidence: Design inference
    confidence: Low
    pending: [V-40]
    rationale: >-
      The MDX calculation script implements every metric with the SPEC semantics. LastNonEmpty serves W-M2. Period-to-date
      metrics anchor on the calendar end of the period, so B-07 does not arise. Same-period-last-year uses a key-based
      member property instead of ParallelPeriod, which misplaces leap-day anchors (V-36). The many-to-many dimension
      deduplicates W-C1 totals, and dimension members exist without facts, so B-08 does not arise. The model is
      well-formed and every reference resolves, but no MDX has executed.
    citations: [V-35, V-36, 02-implementations/ssas-md/SSAS_MD_GUIDE.md, scripts/test_ssas_md.py]
    confirm: >-
      All 22 metric files reconcile to the oracle on the deployed cube. Watch above all the N-C1 cells for 2024 dates
      after 28 February and the W-C2 91-day anchor; a mismatch there overturns the cell.

  - stack: S2
    dimension: E1
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-14, B-15]
    rationale: >-
      Explicit DAX measures implement the SPEC anchors: the calendar end of the period capped at 2024-12-31, with
      29 February mapped to 28 February. Built-in calendar time intelligence cannot serve the composite and hybrid
      variants (B-14). Measures carry ISCROSSFILTERED guards so the applicability matrix's N cells return blank instead
      of a repeated total (B-15). Every DAX reference resolves against the TMDL, but no DAX engine ran.
    citations: [V-13, 02-implementations/powerbi-tabular/POWERBI_TABULAR_GUIDE.md, scripts/test_powerbi_tabular.py]
    confirm: >-
      All 22 metric queries reconcile in the Import, Direct Lake and DirectQuery variants. An N cell that returns a
      value, or a YTD cell that disagrees on a sparse member, overturns the cell.

  - stack: S3
    dimension: E1
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-05, B-17]
    pending: [V-52]
    rationale: >-
      All 22 metric plans reproduce the oracle on the fixtures through the VizQL Data Service emulator. The emulator
      restates each Tableau calculation in SQL, so Tableau's own evaluation is inferred, not shown. Semi-additive stock
      needs an EXCLUDE level-of-detail pattern that names every non-date dimension (B-05). Period-to-date metrics need an
      As-of Date parameter and one query per anchor, which keeps them calendar-anchored (B-17).
    citations: [V-47, V-48, 02-implementations/bi-layer/TABLEAU_GUIDE.md, 02-implementations/bi-layer/tools/vds_emulator.py, scripts/test_tableau.py]
    confirm: >-
      Live VizQL Data Service reconciliation of all 22 metrics. A W-M2 value after an SCD2 change, or a period-to-date
      value read with the parameter override, that differs from the oracle overturns the cell.

  - stack: S4
    dimension: E1
    rating: Partial
    evidence: Design inference
    confidence: Low
    boundaries: [B-07, B-08]
    pending: [V-30]
    subset: >-
      Holds for all 17 metric files without a window measure: the emulator reproduces every committed B0 cell. It
      fails for N-C1 and N-C2 month × member rows of sparse members: 12 rows with an early anchor and 27 absent rows
      across Staten Island, EWR, the Unknown payment type and vendor 6.
    rationale: >-
      Non-window measures are exact on the real data: 64 of 65 non-window queries match, and the one difference is
      B-08. Window measures anchor a coarser group on the last date with data, not the calendar end of the period
      (B-07, V-30). Members without facts are unreachable (B-08). The exposure was counted on B0.
    citations: [V-02, V-30, B-07, B-08, 02-implementations/databricks-metric-views/METRIC_VIEWS_GUIDE.md, scripts/test_databricks_metric_views.py]
    confirm: >-
      Workspace reconciliation of the window metrics. If the sparse-member cells match the oracle, V-30 is false and the
      cell rises to Meets; if they differ exactly as counted, B-07 is confirmed.

  # ------------------------------------------------------------------ E2 Self-service depth
  - stack: S1
    dimension: E2
    rating: Meets
    evidence: Design inference
    confidence: Low
    pending: [V-40]
    rationale: >-
      All 70 questions are expressed in MDX against one unchanged cube. Members are listed independently of facts, so
      the dimension-driven questions (Q-W-S2-P, Q-N-S2-D4) return the oracle's full member lists. Every hierarchy,
      measure and property resolves, and output columns equal the oracle headers.
    citations: [02-implementations/ssas-md/SSAS_MD_GUIDE.md, scripts/test_ssas_md.py]
    confirm: All 70 questions reconcile through Excel or MDX with zero model changes during the run.

  - stack: S2
    dimension: E2
    rating: Meets
    evidence: Design inference
    confidence: Low
    rationale: >-
      All 70 questions are DAX queries against one model per dataset. Questions that list every member iterate the
      dimension, so Q-N-S2-D4 returns all seven payment codes. References resolve and headers match the oracle, but no
      DAX has executed.
    citations: [02-implementations/powerbi-tabular/POWERBI_TABULAR_GUIDE.md, scripts/test_powerbi_tabular.py]
    confirm: All 70 questions reconcile in each storage-mode variant with zero model changes.

  - stack: S3
    dimension: E2
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-16, B-17]
    pending: [V-53]
    rationale: >-
      All 70 question plans reproduce the oracle on the fixtures through the emulator. The query service has no query
      composition, so drill paths query each grain and select client-side (B-16). Period-to-date questions set the As-of
      parameter per anchor (B-17). Dimension-driven questions take members from dimension-only queries and match the
      oracle row for row.
    citations: [V-47, 02-implementations/bi-layer/TABLEAU_GUIDE.md, scripts/test_tableau.py]
    confirm: All 70 plans reconcile against a live site, including the presence-measure handling of unmatched members (V-53).

  - stack: S4
    dimension: E2
    rating: Partial
    evidence: Locally verified
    confidence: Medium
    boundaries: [B-08]
    subset: >-
      All 70 questions are answered by MEASURE() queries over unchanged views. Q-N-S2-D4 cannot list payment codes
      without 2024 trips (5 of the oracle's 7 rows, observed on B0). Q-W-S2-P depends on every month having facts.
    rationale: >-
      The B-08 shortfall is observed on the real data through the emulator and follows from the documented join model,
      in which the source is the fact (V-03). Window questions are safe only when the anchor is selected outside the
      window (V-31); the committed queries do so, but self-service clients may not.
    citations: [V-03, B-08, 02-implementations/databricks-metric-views/METRIC_VIEWS_GUIDE.md, scripts/test_databricks_metric_views.py]
    confirm: >-
      Workspace run of all 70 queries: Q-N-S2-D4 returns 5 rows and every other question matches the oracle (window
      questions included).

  # ------------------------------------------------------------------ E3 Query performance
  - stack: S1
    dimension: E3
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-09]
    pending: [V-39]
    expected_range: >-
      MOLAP P questions well under 2 s warm. The N-C1, N-C2 and W-C2 cells (EXISTING date sets, StrToMember) are the
      formula-engine risk at concurrency 10. Hot-partition queries add the PolyBase hop.
    rationale: >-
      Monthly MOLAP partitions and per-month distinct-count measure groups bound the scans. Aggregations are designed
      from the E3 query log, not in advance. The ROLAP hot partition reads Databricks through SQL Server (B-09), so its
      latency depends on PolyBase pushdown (V-39). The raw-SQL floor is 1.08 s or less for every question.
    citations: [B-09, V-39, 02-implementations/ssas-md/SSAS_MD_GUIDE.md, 01-spec/oracle/ORACLE_REPORT.md]
    confirm: >-
      Warm p95 at concurrency 10 within 2 s (P) and 5 s (D1-D4), measured with and without usage-based aggregations and
      with the hot partition populated.

  - stack: S2
    dimension: E3
    rating: Not assessable
    evidence: Design inference
    confidence: Low
    expected_range: >-
      Import and Direct Lake: P and D questions expected well inside the targets (VertiPaq over about 80M trips is far
      inside the F64 guardrails). DirectQuery: each DAX query becomes one or more SQL queries on serverless SQL, so
      concurrency-10 latency is that of the warehouse and is not projectable.
    rationale: >-
      No workaround is involved, so the measurement alone decides. The expected range favors Import and Direct Lake.
      DirectQuery inherits S4-like live latency plus DAX-to-SQL translation.
    citations: [V-12, 02-implementations/powerbi-tabular/POWERBI_TABULAR_GUIDE.md, 01-spec/oracle/ORACLE_REPORT.md]
    confirm: Warm p95 per variant at concurrency 1 and 10; the DirectQuery variant decides whether S2 needs a workaround.

  - stack: S3
    dimension: E3
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-16, B-17]
    expected_range: >-
      Single-query P questions run at live serverless SQL latency plus the service overhead. Drill-path and multi-anchor
      questions issue several calls (12 for Q-N-C1-P), so their end-to-end time is several round trips.
    rationale: >-
      Live queries compile to SQL on Databricks with relationship join culling. The pervasive WWI security filter always
      joins City. The lack of query composition (B-16) and the per-anchor parameter (B-17) multiply calls; the extract
      variant moves the work to Hyper.
    citations: [B-16, B-17, 02-implementations/bi-layer/TABLEAU_GUIDE.md, 01-spec/oracle/ORACLE_REPORT.md]
    confirm: Warm p95 per question, counting every call of a plan, at concurrency 1 and 10, for live and extract variants.

  - stack: S4
    dimension: E3
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-01]
    expected_range: >-
      Governed profile: live serverless SQL over clustered Delta, near the raw-SQL floor (1.08 s or less on 4 vCPU
      DuckDB) plus warehouse overhead. Accelerated profile: cube-grain questions served from the materializations.
    rationale: >-
      A metric view compiles to the SQL the oracle already runs and joins only what the query needs. Acceleration exists
      only in the accelerated profile, because materialization is impossible over ABAC-governed sources (B-01). The fast
      path and the governed path are therefore different deployments.
    citations: [B-01, V-06, 02-implementations/databricks-metric-views/METRIC_VIEWS_GUIDE.md, 01-spec/oracle/ORACLE_REPORT.md]
    confirm: >-
      Warm p95 at concurrency 10 for both profiles, and which questions the engine serves from materializations.

  # ------------------------------------------------------------------ E4 Data freshness
  - stack: S1
    dimension: E4
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-09, B-10]
    pending: [V-39]
    expected_range: >-
      Pipeline commit latency plus one ClearCache and a ROLAP read through PolyBase: minutes, inside 15 minutes if the
      poller clears the cache at least every few minutes.
    rationale: >-
      The current month is a ROLAP hot partition, so new gold rows are visible without processing. Real-time ROLAP
      cannot be notified through external tables (B-10), so freshness relies on an explicit cache clear, and every read
      crosses the adapter (B-09).
    citations: [V-37, B-09, B-10, 02-implementations/ssas-md/SSAS_MD_GUIDE.md, 02-implementations/ssas-md/jobs/partition_rollover.py]
    confirm: Sentinel trips visible in MDX within 15 minutes at p95, with the cache-clear cadence recorded.

  - stack: S2
    dimension: E4
    rating: Not assessable
    evidence: Documented
    confidence: Medium
    pending: []
    expected_range: >-
      Hybrid NYC model: the real-time DirectQuery partition shows rows as soon as Databricks commits them. Direct Lake:
      mirroring latency (seconds to minutes) plus automatic reframing. DirectQuery: live.
    rationale: >-
      Each NYC variant has a documented live path: a hybrid real-time partition, Direct Lake reframing, or DirectQuery.
      No workaround is needed, so only the latency measurement can rate the cell.
    citations: [V-12, V-13, 02-implementations/powerbi-tabular/POWERBI_TABULAR_GUIDE.md]
    confirm: Sentinel trip p95 per variant; the Direct Lake mirroring delay is the uncertain term.

  - stack: S3
    dimension: E4
    rating: Partial
    evidence: Documented
    confidence: Medium
    subset: >-
      The live variant shows committed rows on the next query. The extract variant is only as fresh as its last
      incremental refresh, so it meets 15 minutes only with a refresh schedule of that frequency.
    expected_range: Live variant at pipeline latency; extract variant at its refresh interval plus refresh duration.
    rationale: >-
      Incremental extract refresh on the pickup timestamp is documented (V-50). Sub-15-minute schedules are a site
      setting, not a product guarantee.
    citations: [V-50, 02-implementations/bi-layer/TABLEAU_GUIDE.md, 02-implementations/bi-layer/jobs/refresh.py]
    confirm: Sentinel trip p95 for both variants at the configured extract schedule.

  - stack: S4
    dimension: E4
    rating: Meets with workaround
    evidence: Design inference
    confidence: Low
    boundaries: [B-01]
    expected_range: >-
      Governed profile: pipeline commit latency, because every query is live. Accelerated profile: queries the
      materializations cover may serve data up to the hourly refresh old.
    rationale: >-
      The metric view adds no latency of its own over Delta. Freshness and acceleration trade off across the two
      profiles (B-01), and the platform's freshness pipeline is not measured here.
    citations: [B-01, V-06, 02-implementations/databricks-metric-views/METRIC_VIEWS_GUIDE.md]
    confirm: Sentinel trip p95 in both profiles, and whether materialized queries return the sentinel before refresh.

  # ------------------------------------------------------------------ E5 CI/CD
  - stack: S1
    dimension: E5
    rating: Meets
    evidence: Design inference
    confidence: Low
    pending: [V-40]
    rationale: >-
      A push runs lint, then deploy and process over XMLA, then the P-question reconciliation gate, then promotion on
      main, with no manual step in the flow. Deployment runs on a self-hosted Windows runner, and the engine's acceptance
      of the generated ASSL is untested (V-40).
    citations: [V-40, 02-implementations/ssas-md/SSAS_MD_GUIDE.md, .github/workflows/s1-ssas-md.yml]
    confirm: A model change flows to prod unattended, and redeploying the previous commit rolls it back.

  - stack: S2
    dimension: E5
    rating: Partial
    evidence: Documented
    confidence: Medium
    boundaries: [B-12, B-13]
    subset: >-
      Model, refresh and reconciliation are automated (fabric-cicd, enhanced refresh, XMLA gate). Copilot verified
      answers, AI-instruction sync and per-environment connections and role membership are manual.
    rationale: >-
      Verified answers are not supported by Git, REST or deployment pipelines (V-43), so a change touching them needs a
      manual step. RLS models force the CI gate onto XMLA with a stored service-principal secret (B-13).
    citations: [V-17, V-43, B-12, B-13, 02-implementations/powerbi-tabular/POWERBI_TABULAR_GUIDE.md, 02-implementations/powerbi-tabular/copilot/verified_answers.md]
