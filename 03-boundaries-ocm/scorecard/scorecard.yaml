      models. The lakehouse-native layer is the one that falls short (Q-N-S2-D4, B-08).
    confirm: E2 runs with zero model changes on S1 and S2.

  - claim: MC-07
    verdict: Refuted with cost
    evidence: Design inference
    confidence: Low
    cells: [S1/E8, S2/E8, S3/E8, S4/E8]
    rationale: >-
      Each BI layer enforces the SPEC § 10 rules for its BI and agent consumers, but the rules are written three more
